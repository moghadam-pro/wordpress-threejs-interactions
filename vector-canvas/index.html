<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Four-State Vector Canvas</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="wm-vector-demo-page">
  <main class="wm-vector-demo-shell">
    <section class="wm-vector" id="wm-vector-demo" data-wm-vector data-state="0" aria-label="انیمیشن وکتوری چهارحالته">
      <canvas class="wm-vector__canvas" data-wm-vector-canvas aria-hidden="true"></canvas>

      <div class="wm-vector__switcher" role="group" aria-label="انتخاب فرم وکتور">
        <button class="is-active" type="button" data-vector-state="0" aria-label="افشانه فیبرنوری" aria-pressed="true"></button>
        <button type="button" data-vector-state="1" aria-label="فرم نیم‌کره" aria-pressed="false"></button>
        <button type="button" data-vector-state="2" aria-label="فرم موجی" aria-pressed="false"></button>
        <button type="button" data-vector-state="3" aria-label="فرم ساعت‌شنی" aria-pressed="false"></button>
      </div>

      <p class="wm-vector__status" data-wm-vector-status aria-live="polite">افشانه فیبرنوری</p>
    </section>
  </main>

  <script type="module" src="./stats-section.js"></script>
</body>
</html>
